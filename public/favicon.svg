<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shield_grad" x1="128" y1="64" x2="384" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glow_grad" x1="256" y1="120" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="iris_glow" cx="256" cy="256" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#glow_grad)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Shield Shape (Assam Governance & Trust) -->
  <path d="M256 64L112 128V244C112 344 173 434 256 456C339 434 400 344 400 244V128L256 64Z"
        fill="url(#shield_grad)"
        stroke="#38bdf8"
        stroke-width="10"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Internal Shield Inset Line -->
  <path d="M256 88L132 144V244C132 330 185 410 256 430C327 410 380 330 380 244V144L256 88Z"
        stroke="#ffffff"
        stroke-width="3"
        stroke-opacity="0.25"
        stroke-linejoin="round"
        fill="none" />

  <!-- Iris Glow Aura -->
  <circle cx="256" cy="256" r="90" fill="url(#iris_glow)" />

  <!-- Drishti Eye Contour (Observability & Vigilance) -->
  <path d="M160 256C192 204 224 186 256 186C288 186 320 204 352 256C320 308 288 326 256 326C224 326 192 308 160 256Z"
        fill="#090d16"
        fill-opacity="0.6"
        stroke="#e0f2fe"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Radar Pulse Ring -->
  <circle cx="256" cy="256" r="46" stroke="#38bdf8" stroke-width="6" stroke-dasharray="8 6" fill="none" />

  <!-- Central Dynamic Service Pulse (Solid White Pupil with Checkmark Accent) -->
  <circle cx="256" cy="256" r="26" fill="#38bdf8" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />

  <!-- High-contrast Verification Checkmark (SLA Compliance) -->
  <path d="M216 264L244 292L304 228"
        stroke="#ffffff"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>